name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    name: Android CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Install Android SDK 37
        run: |
          if [[ -d "${ANDROID_HOME}/build-tools/36.0.0" ]] && \
             [[ -f "${ANDROID_HOME}/platforms/android-37.0/android.jar" || -f "${ANDROID_HOME}/platforms/android-37/android.jar" ]]; then
            exit 0
          fi
          if [[ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/android" ]]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/android" --sdk="${ANDROID_HOME}" sdk install \
              platforms/android-37.0
            "${ANDROID_HOME}/cmdline-tools/latest/bin/android" --sdk="${ANDROID_HOME}" sdk install \
              build-tools/36.0.0
          else
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ShareToLens-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
