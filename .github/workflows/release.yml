name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Install Android SDK 37
        run: |
          if [[ -d "${ANDROID_HOME}/build-tools/36.0.0" ]] && \
             [[ -f "${ANDROID_HOME}/platforms/android-37.0/android.jar" || -f "${ANDROID_HOME}/platforms/android-37/android.jar" ]]; then
            exit 0
          fi
          if [[ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/android" ]]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/android" --sdk="${ANDROID_HOME}" sdk install \
              platforms/android-37.0
            "${ANDROID_HOME}/cmdline-tools/latest/bin/android" --sdk="${ANDROID_HOME}" sdk install \
              build-tools/36.0.0
          else
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" "build-tools;36.0.0"
          fi

      - name: Set release version
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION_NAME}"
          if (( 10#${MINOR} > 999 || 10#${PATCH} > 999 )); then
            echo "Minor and patch versions must be between 0 and 999" >&2
            exit 1
          fi
          VERSION_CODE=$((10#${MAJOR} * 1000000 + 10#${MINOR} * 1000 + 10#${PATCH}))
          if (( VERSION_CODE > 2100000000 )); then
            echo "Version code ${VERSION_CODE} exceeds Android's limit" >&2
            exit 1
          fi
          {
            echo "VERSION_NAME=${VERSION_NAME}"
            echo "VERSION_CODE=${VERSION_CODE}"
            echo "APK_NAME=ShareToLens-${GITHUB_REF_NAME}.apk"
          } >> "$GITHUB_ENV"

      - name: Validate signing secrets
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_BASE64}" || (echo "Missing SIGNING_KEYSTORE_BASE64" >&2; exit 1)
          test -n "${SIGNING_KEY_ALIAS}" || (echo "Missing SIGNING_KEY_ALIAS" >&2; exit 1)
          test -n "${SIGNING_KEY_PASSWORD}" || (echo "Missing SIGNING_KEY_PASSWORD" >&2; exit 1)
          test -n "${SIGNING_STORE_PASSWORD}" || (echo "Missing SIGNING_STORE_PASSWORD" >&2; exit 1)

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${SIGNING_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, and build release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease -PversionName="${VERSION_NAME}" -PversionCode="${VERSION_CODE}"

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/${APK_NAME}"
          (
            cd release-assets
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

      - name: Verify APK signature
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "release-assets/${APK_NAME}" | tee "release-assets/${APK_NAME}.signature.txt"

      - name: Attest release APK
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release-assets/${{ env.APK_NAME }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/${{ env.APK_NAME }}
            release-assets/${{ env.APK_NAME }}.sha256
            release-assets/${{ env.APK_NAME }}.signature.txt
